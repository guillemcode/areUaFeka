<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Are U a Guarro?</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --paper: #ffffff;
      --panel: #ffffff;
      --ink: #22201b;
      --muted: #626a73;
      --line: #c9d1d9;
      --shadow: 0 18px 55px rgba(38, 33, 24, 0.13);
      --green: #167a45;
      --green-bg: #c7f0d5;
      --red: #b4232d;
      --red-bg: #ffd9dc;
      --teal: #166b75;
      --amber: #d99a31;
      --blue: #416da7;
      --pink: #b8587f;
      --card-radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0) 260px),
        radial-gradient(circle at 25% 0%, rgba(22, 107, 117, 0.12), transparent 300px),
        var(--bg);
      color: var(--ink);
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      min-height: 38px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #b8ad95;
      box-shadow: 0 8px 18px rgba(38, 33, 24, 0.11);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .puzzle-selector {
      display: flex;
      gap: 8px;
    }

    .puzzle-btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      min-height: auto;
    }

    .puzzle-btn.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    
    @media (max-width: 680px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    .eyebrow {
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    h1 {
      font-size: 2rem;
      line-height: 1;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(255, 250, 240, 0.8);
      white-space: nowrap;
    }

    .weekday-strip {
      display: grid;
      grid-template-columns: repeat(7, 36px);
      gap: 5px;
      justify-content: end;
    }

    .weekday {
      min-height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.68);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .weekday.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: start;
    }

    .board-shell,
    .side-panel {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .board-shell {
      padding: 14px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr)); /* Divide evenly into 5 rows */
      gap: 8px;
      height: calc(100vh - 120px); /* Fill the screen minus the header space */
      min-height: 500px; /* Don't let it get impossibly small */
    }

    .card {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto; /* Lets the card squish safely */
      height: 100%; /* Takes up exactly 1 cell of the board */
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      background: var(--panel);
      color: var(--ink);
      padding: 6px;
      overflow: hidden;
      text-align: left;
    }

    .card.hidden {
      border-color: #b8c2cc;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(239, 243, 247, 0.98)),
        #f6f8fa;
    }

    .card.revealed {
      border-width: 2px;
    }

    .card.revealed::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
    }

    .card.revealed.innocent {
      border-color: var(--green);
      background: linear-gradient(180deg, #fbfffc 0%, #e9faef 42%, var(--green-bg) 100%);
    }

    .card.revealed.innocent::before {
      background: var(--green);
    }

    .card.revealed.criminal {
      border-color: var(--red);
      background: linear-gradient(180deg, #fffafa 0%, #ffeff0 42%, var(--red-bg) 100%);
    }

    .card.revealed.criminal::before {
      background: var(--red);
    }

    .card.selected {
      outline: 3px solid rgba(38, 125, 137, 0.28);
      border-color: var(--teal);
    }

    .card.hint-clue {
      box-shadow: inset 0 0 0 3px rgba(217, 154, 49, 0.75);
    }

    .card.hint-reveal {
      box-shadow: inset 0 0 0 3px rgba(38, 125, 137, 0.8);
    }

    .card.consumed {
      opacity: 0.58;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }

    .coord {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0;
      width: 27px;
    }

    .tag-btn {
      width: 27px;
      height: 27px;
      min-height: 27px;
      padding: 0;
      border-radius: 50%;
      border-color: #c7bea9;
      background: #fff;
      display: grid;
      place-items: center;
    }

    .tag-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.14);
      background: transparent;
    }

    .tag-amber { background: var(--amber); }
    .tag-blue { background: var(--blue); }
    .tag-pink { background: var(--pink); }
    .tag-green { background: var(--green); }

    .portrait {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      place-items: center;
      margin: 0 auto 4px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0)),
        var(--avatar, #d9d0be);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: rgba(0, 0, 0, 0.58);
      font-size: 1.25rem;
      font-weight: 850;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;      /* Fa que la imatge ompli tot el rectangle sense xafar-se */
      object-position: center; /* Centra la imatge verticalment i horitzontalment */
      display: block;
    }

    .card-name {
      display: block;
      text-align: center;
      font-weight: 850;
      text-transform: capitalize;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .profession {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      font-weight: 750;
      letter-spacing: 0;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }

    .status {
      justify-self: center;
      margin-top: 8px;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.74rem;
      font-weight: 850;
      background: #efe8d8;
      color: var(--muted);
      white-space: nowrap;
    }

    .status.innocent {
      color: #ffffff;
      background: var(--green);
    }

    .status.criminal {
      color: #ffffff;
      background: var(--red);
    }

    .clue {
      margin-top: 6px;
      padding: 6px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(0, 0, 0, 0.07);
      font-size: 0.78rem;
      line-height: 1.25;
      color: #3b362f;
      overflow-y: auto; /* Allows scrolling if text is too long */
      max-height: 65px; /* Prevents the text from taking over the whole card */
    }

    .hidden .clue {
      color: #8a8172;
      border-style: dashed;
      background: rgba(255, 255, 255, 0.45);
      display: grid;
      place-items: center;
      text-align: center;
    }

    .sidebar-actions {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .selected-copy {
      color: var(--muted);
      line-height: 1.35;
      min-height: 24px;
    }

    .choice-row,
    .tool-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .side-tools button {
      flex: 1 1 105px;
    }

    .primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      font-weight: 800;
      padding: 0 14px;
    }

    .innocent-btn {
      background: var(--green-bg);
      border-color: rgba(22, 122, 69, 0.58);
      color: #0f5c33;
      font-weight: 850;
      padding: 0 14px;
    }

    .criminal-btn {
      background: var(--red-bg);
      border-color: rgba(180, 35, 45, 0.55);
      color: #8e1720;
      font-weight: 850;
      padding: 0 14px;
    }

    .side-panel {
      padding: 14px;
      display: grid;
      gap: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: #fff;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 1rem;
    }

    .section-title {
      font-size: 0.94rem;
      font-weight: 850;
    }

    .clue-list {
      display: grid;
      gap: 7px;
      max-height: 430px;
      overflow: auto;
      padding-right: 2px;
    }

    .clue-item {
      width: 100%;
      min-height: auto;
      text-align: left;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      padding: 8px;
      border-radius: 8px;
      background: #fff;
    }

    .clue-item.consumed {
      display: none;
      /* opacity: 0.55;
      text-decoration: line-through;
      text-decoration-thickness: 1px; */
    }


    .clue-index {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 800;
      padding-top: 1px;
      width: 28px;
    }

    .clue-body {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .clue-person {
      font-weight: 850;
      text-transform: capitalize;
      overflow-wrap: anywhere;
    }

    .clue-profession {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .clue-text {
      color: #4b463d;
      font-size: 0.84rem;
      line-height: 1.28;
      overflow-wrap: anywhere;
    }

    .hint-box,
    .complete-box {
      display: none;
      border: 1px solid #d8c08f;
      background: #fff6df;
      border-radius: 8px;
      padding: 10px;
      color: #684a12;
      line-height: 1.34;
    }

    .hint-box.visible,
    .complete-box.visible {
      display: grid;
      gap: 8px;
    }

    .complete-box {
      border-color: rgba(59, 143, 103, 0.4);
      background: #edf8f1;
      color: #245d44;
    }

    .history-box {
      display: none;
      border: 1px solid var(--line);
      background: #f8f9fa;
      border-radius: 8px;
      padding: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .history-box.visible {
      display: grid;
      gap: 6px;
    }

    .history-item {
      border-bottom: 1px dashed var(--line);
      padding-bottom: 5px;
    }

    .history-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    dialog {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      box-shadow: var(--shadow);
      max-width: min(420px, calc(100vw - 28px));
    }

    dialog::backdrop {
      background: rgba(36, 30, 22, 0.35);
    }

    .notice {
      padding: 16px;
      display: grid;
      gap: 12px;
      background: #fffaf0;
    }

    .notice h2 {
      font-size: 1.05rem;
    }

    .notice p {
      line-height: 1.4;
      color: #4a4439;
    }

    .notice .choice-row {
      justify-content: end;
    }

    .decision-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
    }

    .decision-head .portrait {
      margin: 0;
    }

    .decision-meta {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 3px;
      text-transform: capitalize;
    }

    .decision-clue {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      min-height: 48px;
    }

    .notice .decision-actions {
      justify-content: space-between;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .board-shell {
        order: 1; /* El tauler va primer */
      }
      .side-panel {
        order: 2; /* Els botons i estadístiques van sota el tauler */
      }
      .clue-list {
        max-height: 260px;
      }
    }

    @media (max-width: 680px) {
      .app { 
        width: 100%; 
        padding: 8px; 
      }
      
      .topbar { 
        grid-template-columns: 1fr; 
        align-items: start; 
        gap: 6px;
        margin-bottom: 12px;
      }
      
      h1 { font-size: 1.45rem; }
      
      .board-shell, .side-panel { 
        padding: 6px; 
      }
      
      /* Deixem que el tauler creixi cap avall perquè cap carta es talli */
      .board {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: auto; 
        height: auto;             
        gap: 4px;
      }

      .card {
        min-height: 100px; /* Alçada mínima segura */
        padding: 4px;
      }

      /* Convertim el contenidor superior en la "caixa" de la imatge */
      .card-top {
        position: relative; /* Serveix d'àncora per als elements flotants */
        display: block;     /* Traiem el flexbox perquè es puguin superposar */
        margin-bottom: 4px;
      }

      .portrait {
        width: 100%;
        height: auto;          /* Deixem que l'alçada es calculi sola */
        aspect-ratio: 4 / 3;   /* Força que l'alçada sigui la meitat de l'amplada */
        margin: 0;
      }

      /* Coordenada absolutament posicionada sobre la foto (A dalt a l'esquerra) */
      .coord { 
        position: absolute; 
        top: 4px; 
        left: 4px; 
        z-index: 10;
        font-size: 0.6rem; 
        padding: 0;
        width: auto;
        border-radius: 4px;
        background: white; /* Traiem la caixa negra */
        color: #111;             /* Text fosc */
        font-weight: 900;
      }

      /* Botó absolutament posicionat sobre la foto (A dalt a la dreta) */
      .tag-btn { 
        position: absolute; 
        top: 4px; 
        right: 4px; 
        z-index: 10;
        width: 22px; 
        height: 22px; 
        min-height: 22px; 
        border-width: 1.5px;
      }
      
      .tag-dot { width: 10px; height: 10px; }

      .card-name { 
        font-size: 0.6rem; 
        line-height: 1; 
        word-break: break-word; /* Obliga a saltar de línia els noms massa llargs */
      }

      .profession { 
        font-size: 0.44rem; 
        margin-top: 2px;
      }
      
      .clue { 
        font-size: 0.45rem; 
        padding: 2px; 
        line-height: 1;
        max-height: none; /* Les pistes llargues s'adaptaran sense desaparèixer */
      }

      .stats { 
        grid-template-columns: 1fr 1fr 1fr; 
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Are U a Guarro?</h1>
      </div>
      <div id="puzzle-selector" class="puzzle-selector"></div>
    </header>

    <main class="layout">
      <section class="board-shell" aria-label="Tauler de pistes">
        <div id="board" class="board"></div>
      </section>

      <aside class="side-panel" aria-label="Estat del joc">
        <div class="stats">
          <div class="stat">
            <span>Revelades</span>
            <strong id="revealed-count">0/20</strong>
          </div>
          <div class="stat">
            <span>Errades</span> <strong id="attempt-count">0</strong>
          </div>
          <div class="stat">
            <span>Temps</span>
            <strong id="timer">00:00</strong>
          </div>
        </div>

        <div class="sidebar-actions" aria-live="polite">
          <p id="selected-copy" class="selected-copy"></p>
          <div class="tool-row side-tools">
            <button id="restart-btn" type="button">Reinicia</button>
            <button id="share-btn" type="button">Copia resultat</button>
          </div>
        </div>

        <div id="hint-box" class="hint-box"></div>
        <div id="complete-box" class="complete-box"></div>
        <div id="history-box" class="history-box"></div>

        <h2 class="section-title">Pistes revelades</h2>
        <div id="clue-list" class="clue-list"></div>
      </aside>
    </main>
  </div>

  <dialog id="choice-dialog">
    <div class="notice">
      <div class="decision-head">
        <span id="choice-avatar" class="portrait" aria-hidden="true"></span>
        <div>
          <span id="choice-coord" class="coord"></span>
          <h2 id="choice-title"></h2>
          <p id="choice-meta" class="decision-meta"></p>
        </div>
      </div>
      <p id="choice-clue" class="decision-clue"></p>
      <div id="choice-actions" class="choice-row decision-actions"></div>
    </div>
  </dialog>

  <dialog id="notice-dialog">
    <div class="notice">
      <h2 id="notice-title"></h2>
      <p id="notice-copy"></p>
      <div class="choice-row">
        <button id="notice-close" class="primary" type="button">D'acord</button>
      </div>
    </div>
  </dialog>

  <script>
    const boardEl = document.querySelector("#board");
    const puzzleSelectorEl = document.querySelector("#puzzle-selector");
    const clueListEl = document.querySelector("#clue-list");
    const selectedCopyEl = document.querySelector("#selected-copy");
    const revealedCountEl = document.querySelector("#revealed-count");
    const attemptCountEl = document.querySelector("#attempt-count");
    const timerEl = document.querySelector("#timer");
    const completeBoxEl = document.querySelector("#complete-box");
    const historyBoxEl = document.querySelector("#history-box");
    const restartBtn = document.querySelector("#restart-btn");
    const shareBtn = document.querySelector("#share-btn");
    const dialog = document.querySelector("#notice-dialog");
    const noticeTitle = document.querySelector("#notice-title");
    const noticeCopy = document.querySelector("#notice-copy");
    const noticeClose = document.querySelector("#notice-close");
    const choiceDialog = document.querySelector("#choice-dialog");
    const choiceAvatar = document.querySelector("#choice-avatar");
    const choiceCoord = document.querySelector("#choice-coord");
    const choiceTitle = document.querySelector("#choice-title");
    const choiceMeta = document.querySelector("#choice-meta");
    const choiceClue = document.querySelector("#choice-clue");
    const choiceActions = document.querySelector("#choice-actions");

    const COLUMNS = ["A", "B", "C", "D", "E", "F", "G"];
    const TAGS = ["", "amber", "blue", "pink", "green"];
    const AVATARS = ["#e3c36f", "#88b6bd", "#d58d78", "#9ebf87", "#c6a5c8", "#e1a85c", "#8fa9d8", "#c6b88e"];


    // 1. LLEGIR LA URL I CONFIGURAR EL TEMA
    const urlParams = new URLSearchParams(window.location.search);
    const currentGroup = urlParams.get('group') === 'roco'
                          ? 'roco'
                          : urlParams.get('group') === 'wiris'
                            ? 'wiris' : 'guarroak';

    const THEMES = {
      guarroak: {
        title: "Are U a Guarro?",
        trait: "guarro",
        notTrait: "horny"
      },
      roco: {
        title: "Are U Gat?",
        trait: "gat",
        notTrait: "escalador"
      },
      wiris: {
        title: "Are U a Sunshine",
        trait: "borde",
        notTrait: "sunshine"
      }
    };
    const activeTheme = THEMES[currentGroup];

      { criminal: true, hint: `Hi ha un nº senar de ${activeTrait}s a la col D`, proof: [4] },	// 7
      { criminal: false, hint: "Puc tenir una mica d'aquest pastís si m'uneixo a vosaltres?", proof: [19] },	// 8
      { criminal: true, hint: `Un nº senar de ${activeNotTrait}s a ${isRoco ? 's' : 'l'}es vores són veïns de #NAME:17`, proof: [0,3] },	// 9
      { criminal: true, hint: "Totes podem ser germanes! Brindem pel dia nacional de les germanes!", proof: [19] },	// 10
      { criminal: false, hint: `Sembla un bon grup... Puc ser la vostra germana encara que sigui ${activeNotTrait}?`, proof: [15] },	// 11
      { criminal: false, hint: `Hi ha 8 ${activeNotTrait}s en total`, proof: [14] },	// 12
      { criminal: true, hint: "Mai delataré les meves germanes de crim!", proof: [9] },	// 13
      { criminal: true, hint: `Només una persona a la col B té exactament 4 ${activeNotTrait}s veïns`, proof: [9] },	// 14
      { criminal: false, hint: `Hi ha més ${activeNotTrait}s a la fila 3 que a la fila 5`, proof: [12,18] },	// 15
      { criminal: true, hint: `Hi ha més ${activeNotTrait}s a la fila 4 que a la fila 5`, proof: [14] },	// 16
      { criminal: true, hint: "Avui és el dia nacional de les germanes! I sí, jo he robat el pastís.", proof: [0,3] },	// 17
      { criminal: true, hint: "Per vosaltres, germanes meves!", proof: [14] },	// 18
      { criminal: true, hint: `Hi ha exactament 4 ${activeNotTrait}s a la col A`, proof: [15] }	// 19
    ];

    // VARIABLES GLOBALS DINÀMIQUES
    let currentPuzzleId = localStorage.getItem('aruafeka-puzzle') || '1';
    let PUZZLE = {};
    let STORAGE_KEY = '';
    let initialReveal = [];
    let state = {};

    const PUZZLE_LOGICS = {
      1: PUZZLE_LOGIC_1,
      2: PUZZLE_LOGIC_2,
      3: PUZZLE_LOGIC_3,
      4: PUZZLE_LOGIC_4,
      5: PUZZLE_LOGIC_5,
      6: PUZZLE_LOGIC_6,
      7: PUZZLE_LOGIC_7,
    };

    function buildPuzzle(id) {
      currentPuzzleId = id;
      localStorage.setItem('aruafeka-puzzle', id);
      
      const logicArray = PUZZLE_LOGICS[id];
      const orderArray = ORDERS[id];

      PUZZLE = {
        date: "2026-05-26-" + currentGroup + "-p" + id,
        width: 4,
        height: 5,
        cards: logicArray.map((logic, index) => {
          // Busquem qui seu en aquesta casella segons la permutació
          const personIndex = orderArray[index];
          const person = PEOPLE[personIndex];
          
          return {
            name: person.name,
            profession: person.profession,
            photo: person.photo,
            criminal: logic.criminal,
            hint: logic.hint,
            proof: logic.proof
          };
        }),
        hints: []
      };

      STORAGE_KEY = `aruafeka-local-${PUZZLE.date}`;
      const foundIndex = PUZZLE.cards.findIndex(card => card.proof && card.proof.length === 0);
      initialReveal = foundIndex !== -1 ? [foundIndex] : [4];
    }

    // FUNCIÓ PER CANVIAR DE PUZLE DES DELS BOTONS
    function switchPuzzle(id) {
      if (currentPuzzleId === id) return; 
      
      buildPuzzle(id);
      Object.assign(state, loadState()); 
      
      boardEl.innerHTML = "";
      
      // En lloc de buscar botons a l'HTML, tornem a pintar-los amb l'estat actualitzat
      renderPuzzleButtons();
      
      render();
    }

    // NOVA FUNCIÓ: CREA ELS BOTONS AUTOMÀTICAMENT LLEGINT ELS PUZLES EXISTENTS
    function renderPuzzleButtons() {
      if (!puzzleSelectorEl) return;
      puzzleSelectorEl.innerHTML = ""; // Buidem el contenidor
      
      // Llegeix totes les claus de PUZZLE_LOGICS (1, 2, 3...)
      Object.keys(PUZZLE_LOGICS).forEach(id => {
        const btn = document.createElement("button");
        btn.type = "button";
        // Si el botó coincideix amb el puzle actual, li posem la classe 'active'
        btn.className = `puzzle-btn ${id === currentPuzzleId ? 'active' : ''}`;
        btn.dataset.id = id;
        btn.textContent = `Cas ${id}`;
        
        // Li afegim l'esdeveniment del clic
        btn.addEventListener("click", () => switchPuzzle(id));
        
        puzzleSelectorEl.appendChild(btn);
      });
    }

    // Inicialitzem el joc!
    buildPuzzle(currentPuzzleId);
    renderPuzzleButtons();
    state = loadState();

    function freshState() {
      return {
        revealed: new Set(initialReveal),
        selected: null,
        consumed: new Set(),
        tags: {},
        errors: 0, // Canviat d'attempts a errors
        imperfections: [],
        revealLog: [...initialReveal],
        history: [], // Nou array per guardar partides passades
        elapsedBase: 0,
        startedAt: Date.now(),
        completeTime: 0
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return freshState();
        const saved = JSON.parse(raw);
        const loaded = {
          ...freshState(),
          ...saved,
          revealed: new Set(saved.revealed || initialReveal),
          consumed: new Set(saved.consumed || []),
          tags: saved.tags || {},
          errors: saved.errors || 0,
          history: saved.history || [],
          imperfections: saved.imperfections || [],
          revealLog: saved.revealLog || [...(saved.revealed || initialReveal)],
          startedAt: Date.now(),
          elapsedBase: saved.elapsedBase || 0
        };
        if (!loaded.revealLog.length) loaded.revealLog = [...loaded.revealed];
        return loaded;
      } catch (error) {
        console.warn("No s'ha pogut carregar la partida", error);
        return freshState();
      }
    }

    function saveState() {
      const snapshot = {
        ...state,
        revealed: [...state.revealed],
        consumed: [...state.consumed],
        elapsedBase: elapsedMs()
      };
      delete snapshot.selected;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
      } catch (error) {
        console.warn("No s'ha pogut desar la partida", error);
      }
    }

    function displayName(name) {
      return name ? name.charAt(0).toUpperCase() + name.slice(1) : "";
    }

    function possessive(index) {
      const name = displayName(PUZZLE.cards[index].name);
      return name.endsWith("s") ? `${name}'` : `${name}'s`;
    }

    function coord(index) {
      const col = index % PUZZLE.width;
      const row = Math.floor(index / PUZZLE.width) + 1;
      return `${COLUMNS[col]}${row}`;
    }

    function initials(card) {
      return card.name.split(/\s+/).map(part => part[0]).join("").slice(0, 2).toUpperCase();
    }

    function formatBetween(match, prefix, leftRaw, rightRaw, selfIndex) {
      const left = Number(leftRaw);
      const right = Number(rightRaw);
      const min = Math.min(left, right);
      const max = Math.max(left, right);
      const minCol = min % PUZZLE.width;
      const minRow = Math.floor(min / PUZZLE.width);
      const maxCol = max % PUZZLE.width;
      const maxRow = Math.floor(max / PUZZLE.width);
      const sameRow = minRow === maxRow;
      const before = min - (sameRow ? 1 : PUZZLE.width);
      const after = max + (sameRow ? 1 : PUZZLE.width);
      const isPrefix = prefix || "";

      if (sameRow) {
        if (minCol === 0 && maxCol === PUZZLE.width - 1) return `${isPrefix}a la fila ${minRow + 1}`;
        if (minCol === 0) return `${prefix ? "és " : ""}a l'esquerra de #NAME:${after}`;
        if (maxCol === PUZZLE.width - 1) return `${prefix ? "és " : ""}a la dreta de #NAME:${before}`;
      } else {
        if (minRow === 0 && maxRow === PUZZLE.height - 1) return `${isPrefix}a la columna ${COLUMNS[minCol]}`;
        if (minRow === 0) return `${prefix ? "és " : ""}per sobre de #NAME:${after}`;
        if (maxRow === PUZZLE.height - 1) return `${prefix ? "és " : ""}per sota de #NAME:${before}`;
      }

      if (selfIndex === before) return `${prefix ? "és " : ""}entre #NAME:${after} i jo`;
      if (selfIndex === after) return `${prefix ? "és " : ""}entre #NAME:${before} i jo`;
      return `${prefix ? "és " : ""}entre #NAME:${before} i #NAME:${after}`;
    }

    function formatClue(raw, selfIndex) {
      return raw
        .replace(/#C:([0-9]+)/gi, (_, col) => COLUMNS[Number(col) - 1] || col)
        .replace(/#NAMES:([0-9]+)/gi, (_, index) => Number(index) === selfIndex ? "meus" : possessive(Number(index)))
        .replace(/(és )?#BETWEEN:pair\(([0-9]+),([0-9]+)\)/gi, (match, prefix, left, right) => formatBetween(match, prefix, left, right, selfIndex))
        .replace(/^#NAME:([0-9]+) és/gi, (_, index) => Number(index) === selfIndex ? "Jo soc" : `${displayName(PUZZLE.cards[Number(index)].name)} és`)
        .replace(/#NAME:([0-9]+)/gi, (_, index) => Number(index) === selfIndex ? "jo" : displayName(PUZZLE.cards[Number(index)].name));
    }

    // DIVIDIM LES FUNCIONS: Una pel CSS i una altra pel Text!
    function cssClass(isCriminal) {
      return isCriminal ? "criminal" : "innocent";
    }
    function traitText(isCriminal) {
      return isCriminal ? activeTrait : activeNotTrait;
    }

    function isProven(index) {
      if (state.revealed.has(index)) return false;
      const card = PUZZLE.cards[index];
      return card.proof.every(item => state.revealed.has(item));
    }

    function validGuess(index, isCriminal) {
      return PUZZLE.cards[index].criminal === isCriminal && isProven(index);
    }

    function onCardClick(index) {
      state.selected = index;
      render();
      if(state.revealed.has(index)) {
        toggleConsumed(index);
        return;
      }
      openChoiceDialog(index);
    }

    function cycleTag(index, event) {
      event.stopPropagation();
      const current = state.tags[index] || 0;
      state.tags[index] = (current + 1) % TAGS.length;
      saveState();
      render();
    }

    function toggleConsumed(index) {
      if (!state.revealed.has(index)) return;
      if (state.consumed.has(index)) {
        state.consumed.delete(index);
      } else {
        state.consumed.add(index);
      }
      saveState();
      render();
    }

    function guess(index, isCriminal) {
      const card = PUZZLE.cards[index];
      state.attempts += 1;
      closeChoiceDialog();

      if (!validGuess(index, isCriminal)) {
        state.errors += 1;
        const already = state.imperfections.some(item => item.index === index && item.type === "error");
        if (!already) state.imperfections.push({ index, type: "error" });
        const requested = traitText(isCriminal);
        const opposite = traitText(!isCriminal);
        notice(
          "No hi ha prou evidència",
          `${displayName(card.name)} no es pot identificar lògicament com a ${requested} amb la informació revelada. Encara existeix un escenari coherent on podria ser ${opposite}.`
        );
        saveState();
        render();
        return;
      }

      state.revealed.add(index);
      state.revealLog.push(index);
      state.selected = index;
      
      if (state.revealed.size === PUZZLE.cards.length && !state.completeTime) {
        state.completeTime = elapsedMs();
        notice("Puzzle completat", `Has tancat el cas en ${formatTime(state.completeTime)} amb ${state.errors} errors.`);
      }

      saveState();
      render();
    }

    function openChoiceDialog(index) {
      const card = PUZZLE.cards[index];
      const revealed = state.revealed.has(index);
      choiceAvatar.innerHTML = card.photo ? `<img src="${card.photo}" alt="">` : initials(card);
      choiceAvatar.style.setProperty("--avatar", AVATARS[index % AVATARS.length]);
      choiceCoord.textContent = coord(index);
      choiceTitle.textContent = displayName(card.name);
      choiceMeta.textContent = card.profession;
      choiceClue.textContent = revealed ? formatClue(card.hint, index) : "Què vols marcar?";
      choiceActions.innerHTML = "";

      /* if (revealed) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.textContent = state.consumed.has(index) ? "Recupera pista" : "Marca pista usada";
        toggle.addEventListener("click", () => {
          toggleConsumed(index);
          closeChoiceDialog();
        });

        const close = document.createElement("button");
        close.type = "button";
        close.className = "primary";
        close.textContent = "Tanca";
        close.addEventListener("click", closeChoiceDialog);
        choiceActions.append(toggle, close);
      } else { */
        const close = document.createElement("button");
        close.type = "button";
        close.textContent = "Cancel·la";
        close.addEventListener("click", closeChoiceDialog);

        const innocent = document.createElement("button");
        innocent.type = "button";
        innocent.className = "innocent-btn";
        innocent.textContent = activeNotTrait;
        innocent.addEventListener("click", () => guess(index, false));

        const criminal = document.createElement("button");
        criminal.type = "button";
        criminal.className = "criminal-btn";
        criminal.textContent = activeTrait;
        criminal.addEventListener("click", () => guess(index, true));

        choiceActions.append(close, innocent, criminal);
      //}

      if (choiceDialog.showModal && !choiceDialog.open) {
        choiceDialog.showModal();
      } else {
        choiceDialog.setAttribute("open", "");
      }
    }

    function closeChoiceDialog() {
      if (!choiceDialog.open) return;
      choiceDialog.close();
    }

    function restart() {
      // Si justs han començat i no han fet errors, no cal guardar res
      if (state.revealed.size <= 1 && state.errors === 0) {
        if (!confirm("Vols reiniciar el tauler?")) return;
        const next = freshState();
        next.history = state.history; // Conservem l'historial anterior
        Object.assign(state, next);
        saveState();
        render();
        return;
      }

      if (!confirm("Vols arxivar aquesta partida i tornar a començar? Quedarà guardada a l'historial!")) return;

      const isComplete = state.revealed.size === PUZZLE.cards.length;
      const timeStr = formatTime(elapsedMs());
      const errCount = state.errors;
      const revCount = state.revealed.size;
      
      let summary = "";
      if (isComplete) {
        summary = `Acabada - Errades: ${errCount} - Temps: ${timeStr}`;
      } else {
        summary = `Inacabada (${revCount}/${PUZZLE.cards.length}) - Errades: ${errCount} - Temps: ${timeStr}`;
      }

      // Guardem la partida actual a l'historial
      const currentHistory = state.history || [];
      currentHistory.push(summary);

      // Creem un nou estat però li passem l'historial intacte
      const next = freshState();
      next.history = currentHistory;
      
      Object.assign(state, next);
      saveState();
      render();
    }

    function shareText() {
      const shareMarks = {
        correct: "🟩",
        error: "🟨",
        pending: "⬜"
      };
      const marks = PUZZLE.cards.map((card, index) => {
        if (!state.revealed.has(index)) return shareMarks.pending;
        const bad = state.imperfections.find(item => item.index === index);
        if (!bad) return shareMarks.correct;
        return shareMarks[bad.type] || shareMarks.error;
      });
      const rows = [];
      for (let row = 0; row < PUZZLE.height; row += 1) {
        rows.push(marks.slice(row * PUZZLE.width, row * PUZZLE.width + PUZZLE.width).join(""));
      }
      const solved = state.revealed.size === PUZZLE.cards.length;
      const resultLine = solved ? "Resolució: completat" : `Progrés: ${state.revealed.size}/${PUZZLE.cards.length}`;
      return [
        activeTheme.title,
        resultLine,
        `Temps: ${formatTime(elapsedMs())}`,
        `Errors: ${state.errors}`,
        rows.join("\n")
      ].join("\n");
    }

    async function copyShare() {
      const text = shareText();
      try {
        await navigator.clipboard.writeText(text);
        notice("Resultat copiat", "El resum del puzzle s'ha copiat al porta-retalls amb una graella d'icones per Slack.");
      } catch (error) {
        notice("Resultat", text);
      }
    }

    function elapsedMs() {
      if (state.completeTime) return state.completeTime;
      return state.elapsedBase + (Date.now() - state.startedAt);
    }

    function formatTime(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function notice(title, copy) {
      noticeTitle.textContent = title;
      noticeCopy.textContent = copy;
      if (dialog.showModal) {
        dialog.showModal();
      } else {
        dialog.setAttribute("open", "");
      }
    }

    function render() {
      renderBoard();
      renderActions();
      renderStats();
      renderClues();
      renderComplete();
      renderHistory();
    }

    function renderBoard() {
      // 1. INITIALIZATION: Build the HTML elements ONLY if the board is empty
      if (boardEl.children.length === 0) {
        PUZZLE.cards.forEach((card, index) => {
          const cardEl = document.createElement("button");
          cardEl.type = "button";
          cardEl.style.setProperty("--avatar", AVATARS[index % AVATARS.length]);
          
          // Set the base HTML structure (images load exactly once here)
          cardEl.innerHTML = `
            <span class="card-top">
              <span class="coord">${coord(index)}</span>
              <span class="portrait"><img src="${card.photo}" alt=""></span>
              <span class="tag-btn" role="button" aria-label="Etiqueta ${displayName(card.name)}">
                <span class="tag-dot"></span>
              </span>
            </span>
            <span>
              <span class="card-name">${displayName(card.name)}</span>
              <span class="profession"></span>
            </span>
            <span class="clue"></span>
          `;

          // Attach static event listeners
          cardEl.addEventListener("click", () => onCardClick(index));
          cardEl.querySelector(".tag-btn").addEventListener("click", event => cycleTag(index, event));
          
          boardEl.appendChild(cardEl);
        });
      }

      // 2. UPDATE: Loop through the existing elements and update their dynamic state
      PUZZLE.cards.forEach((card, index) => {
        const revealed = state.revealed.has(index);
        const tagName = TAGS[state.tags[index] || 0];
        const cardEl = boardEl.children[index]; // Target the existing card

        // Update the main button classes
        cardEl.className = [
          "card",
          revealed ? "revealed" : "hidden",
          revealed ? cssClass(card.criminal) : "",
          state.selected === index ? "selected" : "",
          state.consumed.has(index) ? "consumed" : ""
        ].filter(Boolean).join(" ");
        
        cardEl.setAttribute("aria-label", `${coord(index)} ${displayName(card.name)}, ${card.profession}`);

        // Update the tag dot color
        const tagDot = cardEl.querySelector(".tag-dot");
        tagDot.className = `tag-dot ${tagName ? `tag-${tagName}` : ""}`;

        // Update the profession text
        const profEl = cardEl.querySelector(".profession");
        profEl.textContent = card.profession;

        // Update the clue text
        const clueEl = cardEl.querySelector(".clue");
        clueEl.textContent = revealed ? formatClue(card.hint, index) : "Pista amagada";
      });
    }

    function renderActions() {
      const selected = state.selected;

      if (selected === null || selected === undefined) {
        selectedCopyEl.textContent = "Clica una carta per decidir-la o consultar-ne la pista.";
        return;
      }

      const card = PUZZLE.cards[selected];
      const name = displayName(card.name);
      if (state.revealed.has(selected)) {
        selectedCopyEl.textContent = `${name} ja està revelat: ${traitText(card.criminal)}.`; // Utilitza la nova funció del Text
        return;
      }

      selectedCopyEl.textContent = `Decideix ${name} des de la finestra emergent.`;
    }

    function renderStats() {
      revealedCountEl.textContent = `${state.revealed.size}/${PUZZLE.cards.length}`;
      attemptCountEl.textContent = String(state.errors);
      timerEl.textContent = formatTime(elapsedMs());
    }

    function renderClues() {
      clueListEl.innerHTML = "";
      state.revealLog
        .filter((index, position, list) => state.revealed.has(index) && list.indexOf(index) === position)
        .forEach(index => {
          const card = PUZZLE.cards[index];
          const item = document.createElement("button");
          item.type = "button";
          item.className = `clue-item ${state.consumed.has(index) ? "consumed" : ""}`;
          item.addEventListener("click", () => toggleConsumed(index));
          item.innerHTML = `
            <span class="clue-index">${coord(index)}</span>
            <span class="clue-body">
              <span class="clue-person">${displayName(card.name)}</span>
              <span class="clue-profession">${card.profession}</span>
              <span class="clue-text">${formatClue(card.hint, index)}</span>
            </span>
          `;
          clueListEl.appendChild(item);
        });
    }

    function renderComplete() {
      const complete = state.revealed.size === PUZZLE.cards.length;
      completeBoxEl.classList.toggle("visible", complete);
      if (!complete) {
        completeBoxEl.innerHTML = "";
        return;
      }
      completeBoxEl.innerHTML = `<strong>Cas tancat.</strong><span>${formatTime(elapsedMs())} · ${state.errors} errors</span>`;
    }

    function renderHistory() {
      if (!historyBoxEl) return;
      const hasHistory = state.history && state.history.length > 0;
      historyBoxEl.classList.toggle("visible", hasHistory);
      
      if (!hasHistory) {
        historyBoxEl.innerHTML = "";
        return;
      }
      
      historyBoxEl.innerHTML = `<strong>Historial del Cas:</strong>` + 
        state.history.map((h, i) => `<div class="history-item">Int. ${i+1} | ${h}</div>`).join("");
    }

    restartBtn.addEventListener("click", restart);
    shareBtn.addEventListener("click", copyShare);
    noticeClose.addEventListener("click", () => dialog.close());
    document.querySelectorAll('.puzzle-btn').forEach(btn => {
      btn.addEventListener('click', (e) => switchPuzzle(e.target.dataset.id));
    });
    setInterval(() => {
      renderStats();
      if (!state.completeTime) saveState();
    }, 1000);

    document.querySelectorAll('.puzzle-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.id === currentPuzzleId);
    });

    render();
  </script>
</body>
